<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 146" width="184" height="146" fill="none" role="img" aria-label="Ilustración de monitor de estación de trabajo">
  <defs>
    <filter id="sombraPantalla" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <radialGradient id="resplandorAmbar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base y cuello del monitor -->
  <rect x="85" y="117" width="14" height="15.5" fill="#475569"/>
  <rect x="59.5" y="132" width="65" height="5" rx="2.5" fill="#64748b"/>

  <!-- Marco y pantalla del monitor -->
  <rect x="7" y="7" width="170" height="110" rx="6" fill="#09131f" stroke="#1e293b" stroke-width="3" filter="url(#sombraPantalla)"/>

  <!-- Barras superiores izquierdas -->
  <rect x="18" y="19" width="35" height="3" rx="1.5" fill="#64748b"/>
  <rect x="18" y="25" width="55" height="3.5" rx="1.75" fill="#f59e0b"/>

  <!-- Indicador circular con resplandor -->
  <circle cx="155" cy="24" r="14" fill="url(#resplandorAmbar)"/>
  <circle cx="155" cy="24" r="7.2" fill="#f59e0b"/>

  <!-- Líneas de código simulado -->
  <rect x="18" y="42" width="111" height="2.5" rx="1.25" fill="#38bdf8"/>
  <rect x="18" y="49" width="133" height="2" rx="1" fill="#334155"/>
  <rect x="18" y="56" width="89" height="2" rx="1" fill="#f59e0b"/>
  <rect x="18" y="63" width="126" height="2" rx="1" fill="#334155"/>
</svg>
